<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>會務財產推估模擬系統 v4.0</title><link rel="stylesheet" href="styles.css"></head><body><main class="container"><header><div><h1>會務財產推估模擬系統</h1><p>GitHub Pages 純前端版 v4.0</p></div><button id="run" class="primary">執行模擬</button></header><section class="card"><div class="grid"><label>原始資金總額<input id="capital" type="number" value="3000000" step="100000"></label><label>目標維持組數<input id="target_groups" type="number" value="13" min="1" max="25"></label><label>模擬總月數<input id="total_months" type="number" value="36" min="1" max="120"></label><label>安全氣墊月數<input id="safe_months" type="number" value="3" min="1" max="12"></label><label>抽籤模式<select id="sim_mode"><option value="normal">常態獨立機率抽籤</option><option value="worst">最差狀況：第21～25期強制得標</option></select></label><label class="toggle">自動遞補<input id="auto_replenish" type="checkbox"><span>維持目標組數</span></label></div><div class="notice">試算規則沿用原 Python v3：每組5會號、第0期每會號15,000元、活會每期9,000元、得標公式與第25期250,000元尾期。</div><div class="stats"><div><small>起點現金</small><strong id="start_cash">$0</strong></div><div><small>最低現金</small><strong id="min_cash">$0</strong></div><div><small>現金流</small><strong id="debt">—</strong></div></div></section><section class="card"><div class="section-head"><h2>現有會組</h2><div><button id="add" class="secondary">＋ 新增</button><button id="export" class="secondary">💾 匯出 JSON</button><label class="filebtn">📂 匯入 JSON<input id="import" type="file" accept="application/json"></label></div></div><div class="table-wrap"><table><thead><tr><th>流水</th><th>會組編號</th><th>目前期數</th><th>已得標期數</th><th></th></tr></thead><tbody id="groups"></tbody></table></div></section><section class="card"><h2>現金與在會本金走勢</h2><canvas id="chart"></canvas></section><section class="card"><h2>未來月度現金流</h2><div class="table-wrap"><table><thead><tr><th>月份</th><th>有效組數</th><th>活會</th><th>應繳</th><th>得標實領</th><th>配息</th><th>在會本金</th><th>未投入資金</th><th>備註</th></tr></thead><tbody id="records"></tbody></table></div></section><footer>GitHub Pages 純前端計算；會組資料預設只存在瀏覽器 localStorage。</footer></main><script src="app.js"></script></body></html>
